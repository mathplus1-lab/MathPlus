<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathÉcole - Exercices de Géométrie</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom right, #e0f7fa, #ffffff);
    color: #333;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 30px;
    background-color: rgba(255, 255, 255, 0.9);
    padding: 15px 0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav a {
    text-decoration: none;
    color: #333;
    font-weight: bold;
    transition: color 0.3s;
  }
  nav a:hover {
    color: #ff7f50;
  }
  .container {
    max-width: 900px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  h1 {
    text-align: center;
    color: #1e3a8a;
  }
  .exercise {
    margin-bottom: 25px;
  }
  input[type='number'] {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  button {
    background-color: #1e3a8a;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  button:hover {
    background-color: #3b82f6;
  }
  .solution {
    margin-top: 5px;
    color: green;
    font-weight: bold;
  }
  .geometry-diagram {
    text-align: center;
    margin-bottom: 30px;
  }
  .triangle-diagram {
    width: 300px;
    height: 300px;
    background: linear-gradient(to bottom right, #cfe8fc, #ffffff);
    margin: 0 auto;
    border-radius: 12px;
    position: relative;
  }
  .point {
    width: 12px;
    height: 12px;
    background-color: orange;
    border-radius: 50%;
    position: absolute;
  }
  .point-label {
    font-size: 12px;
    color: #1e3a8a;
    position: absolute;
    font-weight: bold;
  }
</style>
</head>
<body>
<nav>
  <a href="index.html">Accueil</a>
  <a href="a
    Algebre.html">Exercices d’Algèbre</a>
  <a href="Geometrie.html">Exercices de Géométrie</a>
</nav>
<div class="container">
  <h1>Exercices de Géométrie - Théorème de Thalès</h1>

  <div class="geometry-diagram">
    <div class="triangle-diagram">
      <div class="point" style="top: 40px; left: 30px;"></div>
      <div class="point-label" style="top: 20px; left: 25px;">A</div>
      <div class="point" style="top: 250px; left: 30px;"></div>
      <div class="point-label" style="top: 260px; left: 25px;">B</div>
      <div class="point" style="top: 250px; left: 250px;"></div>
      <div class="point-label" style="top: 260px; left: 255px;">C</div>
      <div class="point" style="top: 145px; left: 80px; background-color: green;"></div>
      <div class="point-label" style="top: 130px; left: 75px;">D</div>
      <div class="point" style="top: 145px; left: 180px; background-color: green;"></div>
      <div class="point-label" style="top: 130px; left: 175px;">E</div>
      <svg width="100%" height="100%" style="position:absolute; top:0; left:0;">
        <line x1="30" y1="40" x2="30" y2="250" style="stroke:black;stroke-width:2" />
        <line x1="30" y1="250" x2="250" y2="250" style="stroke:black;stroke-width:2" />
        <line x1="30" y1="40" x2="250" y2="250" style="stroke:black;stroke-width:2" />
        <line x1="80" y1="145" x2="180" y2="145" style="stroke:blue;stroke-width:2" />
      </svg>
    </div>
  </div>

  <div class="exercise">
    <p>1. Dans le triangle ABC, DE est parallèle à BC. Si AB = 6 cm et AD = 2 cm, calcule AC si AE = 3 cm.</p>
    <input type="number" id="ex1" placeholder="Ta réponse...">
    <button onclick="showSolution('ex1', 9)">Afficher la solution</button>
    <div id="sol1" class="solution"></div>
  </div>

  <div class="exercise">
    <p>2. Dans le triangle ABC, DE // BC. Si AB = 8 cm, AC = 5 cm et AD = 2 cm, calcule AE.</p>
    <input type="number" id="ex2" placeholder="Ta réponse...">
    <button onclick="showSolution('ex2', 1.25)">Afficher la solution</button>
    <div id="sol2" class="solution"></div>
  </div>
</div>
<script>
function showSolution(exId, solution) {
  document.getElementById('sol' + exId.slice(2)).innerText = 'Solution : ' + solution;
}
</script>
</body>
</html>
