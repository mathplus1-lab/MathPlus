<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MathÉcole - Accueil</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom right, #dbeafe, #ffffff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #1e3a8a;
  }
  h1 {
    font-size: 2.5rem;
    margin-bottom: 40px;
    text-align: center;
  }
  .btn {
    background-color: #1e3a8a;
    color: white;
    padding: 15px 30px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.3s;
    text-decoration: none;
  }
  .btn:hover {
    background-color: #3b82f6;
    transform: scale(1.05);
  }
  .icons {
    display: flex;
    gap: 30px;
    margin-top: 50px;
  }
  .icons img {
    width: 80px;
    height: 80px;
    transition: transform 0.3s;
  }
  .icons img:hover {
    transform: rotate(20deg) scale(1.2);
  }
</style>
</head>
<body>

<h1>Bienvenue à MathÉcole</h1>

<a href="Algebre.html" class="btn">Exercices d’Algèbre</a>
<a href="Geometrie.html" class="btn">Exercices de Géométrie</a>

<div class="icons">
  <img src="https://img.icons8.com/fluency/96/triangle.png" alt="Triangle">
  <img src="https://img.icons8.com/fluency/96/ruler.png" alt="Règle">
  <img src="https://img.icons8.com/fluency/96/calculator.png" alt="Calculatrice">
</div>

</body>
</html>
